services:
  ce-db:
    image: postgres:16-alpine
    container_name: ce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5442:5432"
    volumes:
      - ce-db-data:/var/lib/postgresql/data

  ce-app:
    build: ./app
    container_name: ce-app
    restart: unless-stopped
    depends_on:
      - ce-db
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@ce-db:5432/${DB_NAME}?schema=public
    ports:
      - "3010:3000"

volumes:
  ce-db-data:
