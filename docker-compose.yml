services:
  ce-db:
    image: postgres:16-alpine
    container_name: ce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5442:5432"
    volumes:
      - ce-db-data:/var/lib/postgresql/data

  ce-app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-http://147.93.35.189:3001}
    container_name: ce-app
    restart: unless-stopped
    depends_on:
      - ce-db
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@ce-db:5432/${DB_NAME}?schema=public
      CRM_DATABASE_URL: ${CRM_DATABASE_URL}
    ports:
      - "3010:3000"
    networks:
      - default
      - crm

volumes:
  ce-db-data:

networks:
  default:
  crm:
    external: true
    name: crm-meridian_default
